name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

env:
  C3C_RELEASE: v0.8.5_1
  CURL_VERSION: 8.23.0
  CURL_SHA256: 8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x64, c3c: c3-linux.tar.gz }
          - { os: macos-15, target: macos-aarch64, c3c: c3-macos.zip }
          - { os: windows-2022, target: windows-x64, c3c: c3-windows.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install c3c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$C3C_RELEASE" -R c3lang/c3c -p '${{ matrix.c3c }}' -D "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          case '${{ matrix.c3c }}' in
            *.tar.gz) tar xzf '${{ matrix.c3c }}' ;;
            *) if [ "$RUNNER_OS" = Windows ]; then 7z x -y -bd '${{ matrix.c3c }}' >/dev/null; else unzip -q '${{ matrix.c3c }}'; fi ;;
          esac
          echo "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"

      - name: Cache libcurl
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/curl
          key: curl-${{ env.CURL_VERSION }}-static-ubuntu-22.04

      # a static libcurl (HTTP(S) and file:// only; OpenSSL and zlib linked in): the binary
      # needs only glibc, not a libcurl built the way Debian builds it (CURL_OPENSSL_4)
      - name: Build libcurl (static)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
          lib="$RUNNER_TEMP/curl/lib"
          if [ ! -f "$lib/libcurl.a" ]; then
            cd "$RUNNER_TEMP"
            curl -fsSLO "https://curl.se/download/curl-$CURL_VERSION.tar.xz"
            echo "$CURL_SHA256  curl-$CURL_VERSION.tar.xz" | sha256sum -c
            tar xJf "curl-$CURL_VERSION.tar.xz" && cd "curl-$CURL_VERSION"
            ./configure --prefix="$RUNNER_TEMP/curl" --disable-shared --with-openssl --with-zlib \
              --without-libpsl --without-brotli --without-zstd --without-nghttp2 --without-libidn2 \
              --without-librtmp --without-libssh2 --without-libssh --without-gssapi \
              --disable-ldap --disable-ldaps --disable-rtsp --disable-dict --disable-telnet --disable-tftp \
              --disable-pop3 --disable-imap --disable-smtp --disable-gopher --disable-mqtt --disable-smb \
              --disable-ftp --disable-ipfs --disable-websockets --disable-manual --disable-docs \
              --without-ca-bundle --without-ca-path
            make -j"$(nproc)" install >/dev/null
          fi
          cp /usr/lib/x86_64-linux-gnu/libssl.a /usr/lib/x86_64-linux-gnu/libcrypto.a /usr/lib/x86_64-linux-gnu/libz.a "$lib"/
          # curl first: c3c puts these before the binding's -lcurl, and static libraries are read in order
          echo "C3FLAGS=-L $lib -l curl -l ssl -l crypto -l z" >> "$GITHUB_ENV"

      - name: Cache vcpkg
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-curl-x64-windows-static

      # libcurl and the C runtime linked in, so c3l.exe is a single file
      - name: Install libcurl (static)
        if: runner.os == 'Windows'
        run: |
          vcpkg install curl:x64-windows-static
          lib="$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib"
          cp "$lib/libcurl.lib" "$lib/curl.lib"  # vcpkg names it libcurl.lib; the curl binding links "curl"
          # what static libcurl (curl[core,ssl,sspi]: Schannel) needs besides itself; zs is vcpkg's static zlib
          echo "C3FLAGS=--wincrt=static -L $lib -l zs -l ws2_32 -l bcrypt -l advapi32 -l crypt32 -l secur32 -l iphlpapi" >> "$GITHUB_ENV"

      - name: Build
        run: if [ "$RUNNER_OS" = Windows ]; then c3c build c3l $C3FLAGS; else make; fi

      - name: Test
        if: runner.os == 'Linux'
        run: make test

      - name: Static libcurl, HTTPS with this system's CA certificates
        if: runner.os == 'Linux'
        run: |
          ! ldd build/c3l | grep -E 'libcurl|libssl|libcrypto|libz'
          build/c3l info jecokef902/box2d

      # test/run.sh needs GNU tools and POSIX signals; elsewhere run the unit tests
      - name: Test
        if: runner.os != 'Linux'
        run: c3c test $C3FLAGS && build/c3l verify && build/c3l version

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "c3l ${GITHUB_REF_NAME#v}" = "$(build/c3l version | tr -d '\r')"

      - name: Package
        run: |
          dir=c3l-${{ matrix.target }}
          mkdir "$dir"
          cp README.md LICENSE "$dir"/
          if [ "$RUNNER_OS" = Windows ]; then
            cp build/c3l.exe "$dir"/
            7z a -bd "$dir.zip" "$dir" >/dev/null
          else
            cp build/c3l c3l.1 "$dir"/
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: c3l-${{ matrix.target }}
          path: c3l-${{ matrix.target }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum c3l-*.tar.gz c3l-*.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes c3l-*.tar.gz c3l-*.zip SHA256SUMS
